<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InnerVoice</title>

  <!-- Tailwind via CDN Play (fine for a prototype; swap for a build step in production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Iowan Old Style"', '"Palatino Linotype"', 'Georgia', 'serif'],
          },
          keyframes: {
            pulseSoft: {
              '0%, 100%': { opacity: 0.35 },
              '50%': { opacity: 1 },
            },
            fadeIn: {
              from: { opacity: 0, transform: 'translateY(4px)' },
              to: { opacity: 1, transform: 'translateY(0)' },
            },
          },
          animation: {
            'pulse-soft': 'pulseSoft 1.8s ease-in-out infinite',
            'fade-in': 'fadeIn 0.4s ease-out',
          },
        },
      },
    };
  </script>

  <style>
    /* Hide the caret-jumping scrollbar for a cleaner canvas; keep it usable. */
    #editor::-webkit-scrollbar { width: 6px; }
    #editor::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }

    #editor {
      caret-color: #e5c98f;
    }

    /* Persona carousel: no visible control at all -- you drag directly on
       the wordmark itself. A vertical reel of persona names sits where the
       old suffix ("Voice") used to be; dragging up/down spins it and it
       snaps to the nearest persona on release. A soft top/bottom mask keeps
       neighboring names as a faint peek (the only affordance that hints
       "this is draggable"), rather than a literal slider UI. */
    .wordmark {
      cursor: grab;
      touch-action: none;
    }
    .wordmark.dragging {
      cursor: grabbing;
    }

    .persona-carousel {
      position: relative;
      display: inline-block;
      overflow: hidden;
      vertical-align: bottom;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.35) 24%,
        black 42%,
        black 58%,
        rgba(0, 0, 0, 0.35) 76%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.35) 24%,
        black 42%,
        black 58%,
        rgba(0, 0, 0, 0.35) 76%,
        transparent 100%
      );
    }

    .persona-carousel-track {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      will-change: transform;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .persona-carousel-track.no-transition {
      transition: none;
    }

    .persona-carousel-item {
      display: block;
      color: #d4d4d4; /* matches the old text-neutral-300 suffix color */
      white-space: nowrap;
      line-height: inherit;
    }
    .persona-carousel-item.persona-carousel-spacer {
      visibility: hidden;
    }

    /* Voice-match test: karaoke-style word highlight, synced to playback via
       word-level timestamps (see frontend/voice-match.js). */
    #voice-match-passage .word {
      transition: color 0.15s ease-out;
    }
    #voice-match-passage .word.active {
      color: #e5c98f; /* matches the editor's caret-gold accent */
    }

    .voice-match-chip {
      cursor: pointer;
      user-select: none;
    }
    .voice-match-chip.selected {
      border-color: #e5c98f;
      color: #e5c98f;
    }
  </style>
</head>
<body class="bg-[#0b0b0d] text-neutral-200 min-h-screen flex flex-col items-center justify-center antialiased">

  <!-- Status indicator: tiny, top-right, never intrusive -->
  <div class="fixed top-6 right-6 flex items-center gap-4 text-[11px] tracking-wide text-neutral-500 select-none">
    <button
      id="setup-voice-btn"
      class="hidden underline decoration-dotted hover:text-neutral-300 transition-colors"
      title="Re-record your cloned voice"
    >set up voice</button>
    <button
      id="retest-voice-link"
      class="hidden text-neutral-600 hover:text-neutral-400 transition-colors underline-offset-2 hover:underline"
    >retest my voice</button>
    <span class="flex items-center gap-2">
      <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-neutral-600 transition-colors"></span>
      <span id="status-label">listening</span>
    </span>
  </div>

  <main class="w-full max-w-2xl px-8 flex flex-col items-center">
    <h1
      id="wordmark"
      class="wordmark flex items-center text-sm font-medium tracking-[0.3em] text-neutral-500 uppercase select-none mb-2"
      title="Drag to steer the inner voice"
    >
      <span>Inner</span>
      <span id="persona-carousel" class="persona-carousel">
        <span id="persona-carousel-track" class="persona-carousel-track"></span>
      </span>
    </h1>
    <div
      id="persona-tagline"
      class="text-[11px] text-neutral-600 italic mb-8 h-4 opacity-0 transition-opacity duration-300 select-none"
    ></div>

    <!-- First-run (and on-demand "retest") voice-match test: reads a passage
         aloud in the cloned voice, word-highlighted in sync, while the user
         reads it silently -- see frontend/voice-match.js. Hidden/shown by
         voice-match.js based on localStorage; the free-form editor below
         only appears once this is passed or skipped. -->
    <section id="voice-match" class="hidden w-full flex flex-col items-center" aria-live="polite">
      <p id="voice-match-status" class="text-sm text-neutral-500 mb-8 text-center max-w-md">
        Before you start writing, let's check your InnerVoice. Read the passage
        below in your head — I'll read it back to you.
      </p>

      <p
        id="voice-match-passage"
        class="text-2xl leading-relaxed font-serif text-neutral-200 text-center mb-10 max-w-xl select-none"
      ></p>

      <button
        id="voice-match-begin"
        class="px-5 py-2 rounded-full border border-neutral-700 text-neutral-300 text-sm tracking-wide
               hover:border-neutral-500 hover:text-neutral-100 transition-colors
               disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:border-neutral-700 disabled:hover:text-neutral-300"
        disabled
      >Loading your voice…</button>

      <div id="voice-match-result" class="hidden flex flex-col items-center gap-4 mt-2">
        <p class="text-sm text-neutral-400">Did that match how you hear it in your head?</p>
        <div class="flex gap-3">
          <button
            id="voice-match-yes"
            class="px-4 py-1.5 rounded-full border border-emerald-800 text-emerald-300 text-sm
                   hover:border-emerald-600 hover:text-emerald-100 transition-colors"
          >Yes, that's me</button>
          <button
            id="voice-match-no"
            class="px-4 py-1.5 rounded-full border border-neutral-700 text-neutral-300 text-sm
                   hover:border-neutral-500 hover:text-neutral-100 transition-colors"
          >Not quite</button>
        </div>
      </div>

      <div id="voice-match-feedback" class="hidden flex flex-col items-center gap-4 mt-2 max-w-md">
        <p class="text-sm text-neutral-400 text-center">What was off?</p>
        <div id="voice-match-chips" class="flex flex-wrap gap-2 justify-center"></div>
        <button
          id="voice-match-submit"
          class="px-4 py-1.5 rounded-full border border-neutral-700 text-neutral-300 text-sm
                 hover:border-neutral-500 hover:text-neutral-100 transition-colors mt-2"
        >Submit &amp; try again</button>
      </div>

      <button
        id="voice-match-skip"
        class="text-[11px] text-neutral-600 hover:text-neutral-400 transition-colors mt-10 underline-offset-2 hover:underline"
      >Skip for now</button>
    </section>

    <textarea
      id="editor"
      class="hidden w-full min-h-[45vh] bg-transparent resize-none outline-none border-none
             text-2xl leading-relaxed font-serif text-neutral-100 placeholder-neutral-600
             tracking-wide"
      placeholder="Begin writing…"
      spellcheck="false"
    ></textarea>
  </main>

  <!-- Subtle whisper caption: the last phrase InnerVoice spoke.
       Purely optional visual trace of the audio -- never a chat box.
       Only used when ENABLE_ECHO_REVEAL=false: appears instantly, fades on
       a fixed timer -- never persistent.
       "Echo Mode" (ENABLE_ECHO_REVEAL=true, see docs/research-roadmap.md
       #10) does NOT use this element at all -- instead the whisper is
       typed directly into #editor, word-by-word, so it becomes part of
       what the user wrote rather than a separate overlay. All fade/reveal
       timing is driven from frontend/app.js. -->
  <div
    id="whisper-caption"
    class="fixed bottom-10 left-1/2 -translate-x-1/2 max-w-xl text-center
           text-sm text-neutral-500 italic opacity-0 transition-opacity duration-700 select-none px-6"
  ></div>

  <script src="voice-gate.js"></script>
  <script src="voice-match.js"></script>
  <script src="app.js"></script>
</body>
</html>
